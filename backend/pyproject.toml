[project]
name = "skladchina-backend"
version = "1.0.0"
description = "API «СберВместе» — учёт общих расходов"
# Upper bound is real, not caution: the AI pipeline pins torch 2.8.0, which
# publishes wheels for cp39-cp313 only, and GigaAM's model code needs that torch.
# The Docker image is python:3.12-slim, which is the version this is tested on.
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore:.*does \\*not\\* support Decimal objects natively.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    # Depends(...) в аргументах по умолчанию — обычный способ объявлять
    # зависимости FastAPI.
    "B008",
    # `class X(str, Enum)` предлагается заменить на `StrEnum`. Это не
    # косметика: у StrEnum другой `str()` («equal» вместо «SplitMode.EQUAL»),
    # а значения этих перечислений уходят в БД, в JSON и в сравнения со
    # строками. Меняем осознанно и вместе с тестами, а не по подсказке линтера.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"alembic/versions/*" = ["E501"]
