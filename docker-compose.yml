name: skladchina

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skladchina}
      POSTGRES_USER: ${POSTGRES_USER:-skladchina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skladchina}
    volumes:
      - skladchina_pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so you can inspect the database with psql from the host. Defaults
      # to 5433 because a locally installed Postgres almost always holds 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skladchina} -d ${POSTGRES_DB:-skladchina}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skladchina}:${POSTGRES_PASSWORD:-skladchina}@db:5432/${POSTGRES_DB:-skladchina}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-please-32-chars-minimum}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # The browser only ever talks to the frontend origin, which proxies /api,
      # so this is the address that must appear in invite links.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      INVITE_EXPIRE_HOURS: ${INVITE_EXPIRE_HOURS:-336}
      SEED_ON_START: ${SEED_ON_START:-true}
      # Read by entrypoint.sh while it waits for Postgres.
      DB_WAIT_ATTEMPTS: ${DB_WAIT_ATTEMPTS:-60}
      DB_WAIT_INTERVAL: ${DB_WAIT_INTERVAL:-2}
      # Protocol names. The SPA hardcodes the same values in src/lib/api.ts, so
      # change both sides together or leave them at the defaults.
      APP_NAME: ${APP_NAME:-СберВместе}
      COOKIE_NAME: ${COOKIE_NAME:-skladchina_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-skladchina_csrf}
      CSRF_HEADER_NAME: ${CSRF_HEADER_NAME:-X-CSRF-Token}
      # Speech-to-text (GigaAM-v3) runs inside this container; the weights are
      # downloaded on the first voice request and cached in the volume below.
      GIGAAM_MODEL: ${GIGAAM_MODEL:-ai-sage/GigaAM-v3}
      GIGAAM_REVISION: ${GIGAAM_REVISION:-e2e_rnnt}
      GIGAAM_DEVICE: ${GIGAAM_DEVICE:-cpu}
      # The LLM is the GigaChat API — a remote HTTPS service, so nothing extra
      # runs on the host or in a container. GIGACHAT_CREDENTIALS is a SECRET:
      # it comes from .env (which is gitignored) and has no default here on
      # purpose — an empty key degrades the AI features, it does not break the
      # app. Never write the real key into this file.
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-3-Ultra}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://api.giga.chat}
      GIGACHAT_TIMEOUT_SECONDS: ${GIGACHAT_TIMEOUT_SECONDS:-45}
    volumes:
      - skladchina_hf_cache:/home/skladchina/.cache/huggingface
    ports:
      # Exposed for the OpenAPI docs at http://localhost:8000/api/docs.
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  skladchina_pgdata:
  # GigaAM weights, downloaded once on the first voice request.
  skladchina_hf_cache:
