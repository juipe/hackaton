server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin proxy to the API. Because the browser only ever talks to this
    # origin, the session cookie stays HttpOnly + SameSite=Lax with no CORS
    # preflight and no token handling in the client.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # The largest legitimate body is a voice note (VOICE_MAX_UPLOAD_BYTES,
        # 15 MB); receipts are capped at 10 MB. Cut oversized uploads at the
        # proxy so they never reach the backend's multipart parser.
        client_max_body_size 16m;
        # A voice request is the slow one: GigaAM transcription in-process
        # plus a GigaChat API call (GIGACHAT_TIMEOUT_SECONDS, 45s by default).
        # Keep this comfortably above their sum, or the proxy cuts the request
        # off before the backend has answered.
        proxy_read_timeout 120s;
    }

    # Hashed build assets are immutable; everything else must revalidate so a
    # deploy is visible on the next reload.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
